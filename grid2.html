<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Grid</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#1f1448;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:900px;
            display:grid;
            grid-template-columns:repeat(3,1fr);
            grid-template-rows:140px 140px 140px;
            gap:15px;
        }

        .box{
            border-radius:18px;
            padding:20px;
            color:white;
        }

        .dark{
            background:#35206d;
        }

        .light{
            background:#eefcff;
            color:#111;
        }

        .social{
            display:flex;
            flex-direction:column;
            justify-content:space-between;
        }

        .icons{
            display:flex;
            gap:10px;
        }

        .icon{
            width:45px;
            height:45px;
            background:#4b3390;
            border-radius:10px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:20px;
        }

        .number{
            font-size:60px;
            font-weight:bold;
            text-align:center;
            margin-top:20px;
        }

        .title{
            text-align:center;
        }

        .users{
            font-size:55px;
            font-weight:bold;
        }

        .design{
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:32px;
            font-weight:bold;
        }

        .learn{
            grid-column:1 / 3;
            display:flex;
            align-items:end;
            font-size:28px;
            font-weight:bold;
        }

        .followers{
            grid-row:2 / 4;
            display:flex;
            justify-content:flex-end;
            align-items:flex-end;
            padding-bottom:25px;
            padding-right:25px;
            font-size:70px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="box dark social">
        <p>Average Daily of Apps</p>

        <div class="icons">
            <div class="icon"><img src="heart-regular-full.svg" alt="heart"></div>
            <div class="icon"><img src="comment-regular-full.svg" alt="comment"></div>
            <div class="icon"><img src="fashion.svg" alt="fashion"></div>
            <div class="icon"><img src="instagram-brands-solid-full.svg" alt="ig"></div>
        </div>
    </div>

    <div class="box dark">
        <div class="number">25K</div>
        <div class="title">Monthly Likes</div>
    </div>

    <div class="box dark">
        <div class="number">50K</div>
        <div class="title">Weekly Views</div>
    </div>

    <div class="box dark">
        <p>Active Users</p>
        <div class="users">1,538</div>
    </div>

    <div class="box dark design">
        DESIGN
    </div>

    <div class="box light followers">
        200K
    </div>

    <div class="box dark learn">
        A place to learn UI Design & Web Design.
    </div>

</div>

</body>
</html>
