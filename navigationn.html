<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f1f3f6;
        }

        /* ================= NAVBAR ================= */

        .navbar{
            width: 100%;
            height: 70px;

            background-color: #2874f0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;
        }

        /* LOGO */

        .logo{
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        /* SEARCH BAR */

        .search-bar{
            flex: 1;
            margin: 0 20px;
        }

        .search-bar input{
            width: 100%;
            height: 40px;

            border: none;
            outline: none;

            border-radius: 5px;

            padding-left: 15px;

            font-size: 16px;
        }

        /* NAVIGATION LINKS */

        .nav-links{
            display: flex;
            gap: 15px;
        }

        .nav-links a{
            text-decoration: none;
            color: white;

            font-size: 16px;
            font-weight: bold;

            padding: 10px 15px;

            border-radius: 5px;

            transition: 0.3s;
        }

        .nav-links a:hover{
            background-color: white;
            color: #2874f0;
        }

        /* MOBILE RESPONSIVE */

        @media(max-width: 768px){

            .navbar{
                flex-direction: column;
                height: auto;
                padding: 15px;
            }

            .search-bar{
                width: 100%;
                margin: 15px 0;
            }

            .nav-links{
                flex-wrap: wrap;
                justify-content: center;
            }
        }

    </style>

</head>
<body>

    <nav class="navbar">

        <div class="logo">
            Flipkart
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Search for products">
        </div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Login</a>
            <a href="#">Cart</a>
            <a href="#">Orders</a>
        </div>

    </nav>

</body>
</html>
