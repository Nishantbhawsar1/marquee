<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body{
            background-color:#2b3035;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            grid-template-rows:repeat(4,1fr);
            height:100vh;
            width:100%;
            gap:10px;
        }
        .box1{
            grid-column:1/2;
            grid-row:1/2;
            height:100%;
            width:100%;
            background-color: #0d6efd;
            color:white;
        }
        .box2{
            background-color:#198754;
            grid-column:2/3;
            grid-row:1/2;
            height:100%;
            width:100%;
            color:white;
        }
        .box3{
            background-color:#ffc107;
            grid-column:3/4;
            grid-row:1/2;
            height:100%;
            width:100%;
            color:rgb(0, 0, 0);
        }
        .box4{
            background-color:#dc3545;
            grid-column:4/5;
            grid-row:1/2;
            height:100%;
            width:100%;
            color:white;
        }
        .box5{
            background-color:lightgray;
            grid-column:1/3;
            grid-row:2/4;
            height:100%;
            width:100%;
        }
        .box6{
            background-color:lightpink;
            grid-column:3/5;
            grid-row:2/4;
            height:100%;
            width:100%;
        }
        .small-box-icon{
            height: 25%;
            width: 25%;
            
        }
        
        

    </style>

</head>
<body>
    <span style="color: white; font-weight: bold; font-size: 24px;">Dashboard</span>
    <span style="color: white; justify-content: end;"><b style="color: blue; margin-left: 90%;"> Home </b> / Dashboard </span>

    <div class="container">       
        <div class="box1">            
            <h1>150</h1>
            <h3>New Orders</h3>
            <svg class="small-box-icon" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M2.25 2.25a.75.75 0 000 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 00-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 000-1.5H5.378A2.25 2.25 0 017.5 15h11.218a.75.75 0 00.674-.421 60.358 60.358 0 002.96-7.228.75.75 0 00-.525-.965A60.864 60.864 0 005.68 4.509l-.232-.867A1.875 1.875 0 003.636 2.25H2.25zM3.75 20.25a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zM16.5 20.25a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0z"></path>
            </svg>
        </div>
        <div class="box2">
            <h1>53%</h1>
            <h3>Bounce Rate</h3>
        </div>
        <div class="box3">
            <h1>44</h1>
            <h3>User Registrations</h3>
        </div>
        <div class="box4">
            <h1>65</h1>
            <h3>Unique Visitors</h3>
        </div>
        <div class="box5"><img src="Screenshot 2026-06-04 222306.png" alt="img1" style="width: 100%; height: 100%; object-fit: cover;"></div>
        <div class="box6"><img src="Screenshot 2026-06-04 222328.png" alt="img2" style="width: 100%; height: 100%; object-fit: cover;"></div>
    </div>
</body>
</html>
