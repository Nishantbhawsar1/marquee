<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body{
            background-color:#2b3035;
        }

        .container{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            grid-template-rows:repeat(4,1fr);
            height:100vh;
            width:100%;
            gap:10px;
        }
        .box1{
            grid-column:1/2;
            grid-row:1/2;
            height:100%;
            width:100%;
            background-color: #0d6efd;
            color:white;
        }
        .box2{
            background-color:#198754;
            grid-column:2/3;
            grid-row:1/2;
            height:100%;
            width:100%;
            color:white;
        }
        .box3{
            background-color:#ffc107;
            grid-column:3/4;
            grid-row:1/2;
            height:100%;
            width:100%;
            color:rgb(0, 0, 0);
        }
        .box4{
            background-color:#dc3545;
            grid-column:4/5;
            grid-row:1/2;
            height:100%;
            width:100%;
            color:white;
        }
        .box5{
            background-color:lightgray;
            grid-column:1/3;
            grid-row:2/4;
            height:100%;
            width:100%;
        }
        .box6{
            background-color:lightpink;
            grid-column:3/5;
            grid-row:2/4;
            height:100%;
            width:100%;
        }
        .box7{
            display:flex;
            justify-content:end;
            height:100%;
            width:100%;
            color:white;
        }

    </style>

</head>
<body>
    <!-- <h1 style="color: white;">Dashboard</h1> -->
    <span style="color: white; font-weight: bold; font-size: 24px;">Dashboard</span>
    <span style="color: white; justify-content: end;"><b style="color: blue; margin-left: 5px;">Home</b>/Dashboard</span>

    <div class="container">       
        <div class="box1">
            <h1>150</h1>
            <h3>New Orders</h3>
        </div>
        <div class="box2">
            <h1>53%</h1>
            <h3>Bounce Rate</h3>
        </div>
        <div class="box3">
            <h1>44</h1>
            <h3>User Registrations</h3>
        </div>
        <div class="box4">
            <h1>65</h1>
            <h3>Unique Visitors</h3>
        </div>
        <div class="box5"><img src="Screenshot 2026-06-04 222306.png" alt="img1"></div>
        <div class="box6"><img src="Screenshot 2026-06-04 222328.png" alt="img2"></div>
    </div>
</body>
</html>
