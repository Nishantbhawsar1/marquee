<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 200px;
            width: 200px;
            background-color: rgb(0, 0, 0);
            display: flex;
            margin-left:37%;
            margin-top:17%;
        }
        .box1{
            height: 100px;
            width: 100px;
            background-color: rgb(0, 128, 255);
            position:absolute;
            margin-left: 0px;
            margin-top: 0px;
            transition: transform 1s ease-in-out;
            transform-origin: bottom left;
            
        }
        .box2{
            height: 100px;
            width: 100px;
            background-color: rgb(0, 128, 255);
            position: absolute;
            margin-left: 100px;
            margin-top: 0px;
            transition: transform 1s ease-in-out;
            transform-origin: top right;
            
        }
        .box3{
            height: 100px;
            width: 100px;
            background-color: rgb(0, 128, 255);
            position: absolute;
            margin-left: 0px;
            margin-top: 100px;
            transition: transform 1s ease-in-out;
            transform-origin: bottom left;
            
        }
        .box4{
            height: 100px;
            width: 100px;
            background-color: rgb(0, 128, 255);
            position: absolute;
            margin-left: 100px;
            margin-top: 100px;
            transition: transform 1s ease-in-out;
            transform-origin: top right;           
        }

        /* .box1:hover{
            transform: rotate(-90deg);
        }
        .box2:hover{
            transform: rotate(90deg);
        }
        .box3:hover{
            transform: rotate(90deg);
        }
        .box4:hover{
            transform: rotate(90deg);
        } */
        .container:hover .box1{
            transform: rotate(-90deg);
        }
        .container:hover .box2{
            transform: rotate(90deg);
        }
        .container:hover .box3{
            transform: rotate(90deg);
        }
        .container:hover .box4{
            transform: rotate(-90deg);
        }
    </style>
</head>
<body>
    <div><h1 style="color: black;">hover over the box to open</h1></div>
    <div class="container" >
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </div>
</body>
</html>
