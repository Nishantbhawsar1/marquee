<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        body{
            background-color: #1f1448;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            height: 100vh;
        }
        .box1{
            background-color: #35206d;
            height: 100%;
            width: 100%;
            text-align: center;
        }
        .box2{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
        }
        .box3{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 3 / 5;
        }
        .box4{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 1 / 5;
        }
        .box5{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
        }
        .box6{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 2 / 5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
    </div>
</body>
</html>
