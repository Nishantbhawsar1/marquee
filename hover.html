<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            display: flex;

        }
        .box1{
            height: 100px;
            width: 100px;
            background-color: aqua;
        }
        .box2{
            height: 100px;
            width: 100px;
            background-color: red;
        }
        .box3{
            height: 100px;
            width: 100px;
            background-color: green;
        }
        .box4{
            height: 100px;
            width: 100px;
            background-color: yellow;
        }

        .box1:hover{
            height: 200px;
            width: 200px;
            background-color: blue;
            border-radius: 50%;
        }
        .box2:hover{
            height: 200px;
            width: 200px;
            background-color:brown;
            border-radius: 50%;
        }
        .box3:hover{
            height: 200px;
            width: 200px;
            background-color: blueviolet;
            border-radius: 50%;
        }
        .box4:hover{
            height: 200px;
            width: 200px;
            background-color: violet;
            border-radius: 50%;
        }

        .container :nth-child(2){
            border: 2px solid black;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </div>
</body>
</html>
