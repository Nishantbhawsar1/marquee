<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html page</title>

    <style>

        .container{
            width: 500px;
            border: 2px solid black;
            padding: 20px;
            background-color: lightyellow;
        }

        .header{
            width: 500px;
            height: 120px;
            border: 2px solid black;
            background-color: skyblue;
        }

        .nav{
            width: 500px;
            height: 80px;
            border: 2px solid black;
            background-color: lightcoral;
        }

        .main{
            width: 293px;
            height: 150px;
            border: 2px solid black;
            background-color: lightgreen;

            display: inline-block;
            padding: 10px;
        }

        .article{
            width: 140px;
            height: 140px;
            border: 2px solid black;
            background-color: lightpink;
            display: inline-block;
        }

        .section {
        width: 140px;
        height: 140px;
        border: 2px solid black;
        background-color: lightgray;
        display: inline-block;
       }

        .aside{
            width: 174px;
            height: 141px;
            border: 2px solid black;
            background-color: lightblue;
            display: inline-block;
            margin-top: 10px;
        }

        .footer{
            width: 500px;
            height: 80px;
            border: 2px solid black;
            background-color: lightcoral;
            display: inline-block;
        }

    </style>


</head>
<body>
    <div class="container">
        <div class="header"></div>
        <div class="nav"></div>
        <div class="main">
            <div class="article"></div>
            <div class="section"></div>
        </div>
        <div class="aside"></div>
        <div class="footer"></div>
        
    </div>
</body>
</html>
