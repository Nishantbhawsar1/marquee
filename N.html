<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter-N</title>

    <style>
        body{
            background-color: #ffffff;
        }
        .container{
            display: grid;
            grid-template-columns: 100px 100px 100px 100px 100px;
            grid-template-rows: 100px 100px 100px 100px 100px;
            gap: 10px;
            height: 100vh;
        }
        .box1{
            background-color: #35206d;
            height: 100%;
            width: 100%;
            text-align: center;
            grid-row: 1 / 2;
            grid-column: 1 / 2;
            border: 5px solid black;
            display: flex;
            
        }
        .box2{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-row: 2 / 3;
            border: 5px solid black;
            
        }
        .box3{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-row: 3 / 4;
            border: 5px solid black;
            
        }
        .box4{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-row: 4 / 5;
            border: 5px solid black;
            
        }
        .box5{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 2/3;
            grid-row: 2 / 3;
            border: 5px solid black;
        }
        .box6{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 3/4;
            grid-row: 3/4;
            border: 5px solid black;
        }
        .box7{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 4/5;
            grid-row: 4/5;
            border: 5px solid black;            
        }
        .box8{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 4/5;
            grid-row: 3/4;
            border: 5px solid black;            
        }
        .box9{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 4/5;
            grid-row: 2/3;
            border: 5px solid black;            
        }
        .box10{
            background-color: #35206d;
            text-align: center;
            height: 100%;
            width: 100%;
            grid-column: 4/5;
            grid-row: 1/2;
            border: 5px solid black;            
        }
        .inside{
            background-color: #ffffff;
            height: 50%;
            width: 50%;
            margin: auto;
            border: 5px solid black;

        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">1
            <div class="inside">11</div>
        </div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
        <div class="box5">5</div>
        <div class="box6">6</div>
        <div class="box7">7</div>
        <div class="box8">8</div>
        <div class="box9">9</div>
        <div class="box10">10</div>
    </div>
</body>
</html>
