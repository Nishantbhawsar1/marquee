<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f9f9f9;
    }

    /* Header */
    header{
      height:60px;
      background:white;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 20px;
      position:sticky;
      top:0;
      box-shadow:0 1px 5px rgba(0,0,0,0.1);
    }

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:24px;
      font-weight:bold;
      color:red;
    }

    .search-box{
      flex:1;
      display:flex;
      justify-content:center;
      margin:0 30px;
    }

    .search-box input{
      width:60%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:20px 0 0 20px;
      outline:none;
    }

    .search-box button{
      padding:10px 20px;
      border:none;
      background:red;
      color:white;
      border-radius:0 20px 20px 0;
      cursor:pointer;
    }

    .profile{
      width:40px;
      height:40px;
      background:#ddd;
      border-radius:50%;
    }

    /* Main Layout */
    .container{
      display:flex;
    }

    /* Sidebar */
    .sidebar{
      width:220px;
      background:white;
      height:calc(100vh - 60px);
      padding:20px;
      position:fixed;
    }

    .sidebar ul{
      list-style:none;
    }

    .sidebar ul li{
      padding:12px;
      margin-bottom:10px;
      border-radius:10px;
      cursor:pointer;
    }

    .sidebar ul li:hover{
      background:#f1f1f1;
    }

    /* Video Section */
    .content{
      margin-left:240px;
      padding:20px;
      width:100%;
    }

    .videos{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
      gap:20px;
    }

    .video-card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .video-card:hover{
      transform:scale(1.03);
    }

    .thumbnail{
      width:100%;
      height:150px;
      background:#ccc;
    }

    .video-info{
      padding:15px;
    }

    .video-title{
      font-size:16px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .channel{
      color:gray;
      font-size:14px;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    

    <div class="search-box">
      <input type="text" placeholder="Search">
      <button>Search</button>
    </div>

    <div class="profile"></div>
  </header>

  <!-- Main Content -->
  <div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
      <ul>
        <li> Home</li>
        <li> Trending</li>
        <li> Subscriptions</li>
        <li> Music</li>
        <li> Gaming</li>
        <li> Settings</li>
      </ul>
    </div>

    <!-- Videos -->
    <div class="content">
      <div class="videos">

        <div class="video-card">
          <div class="thumbnail"></div>
          <div class="video-info">
            <div class="video-title">Learn HTML & CSS</div>
            
          </div>
        </div>

        <div class="video-card">
          <div class="thumbnail"></div>
          <div class="video-info">
            <div class="video-title">JavaScript Tutorial</div>
            
          </div>
        </div>

        <div class="video-card">
          <div class="thumbnail"></div>
          <div class="video-info">
            <div class="video-title">React JS Crash Course</div>
            
          </div>
        </div>

        <div class="video-card">
          <div class="thumbnail"></div>
          <div class="video-info">
            <div class="video-title">CSS Animation Effects</div>
            <div class="channel"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
