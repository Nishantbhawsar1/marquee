<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLIPCART</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body{
    width: 100%;
    height: 100%;
}

body{
    background-color: lightyellow;
}

.container{
    width: 100%;
    min-height: 100vh;
    border: 0.125rem solid black;
    background-color: lightyellow;
}

/* ================= TOP BAR ================= */

.box1{
    width: 100%;
    min-height: 4rem;
    border: 0.125rem solid black;
    background-color: white;

    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.5rem 1rem;
}

.flipkart,
.travel{
    width: 4.5rem;
    height: 2.2rem;
    border: 0.125rem solid black;
    display: flex;
    justify-content: center;
    align-items: center;
}

.flipkart{
    background-color: yellow;
}

.travel{
    background-color: lightgray;
}

.location{
    margin-left: auto;
}

/* ================= SEARCH BAR ================= */

.box2{
    width: 100%;
    min-height: 4rem;
    border: 0.125rem solid black;
    background-color: white;

    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.5rem 1rem;
}

.search{
    flex: 1;
    height: 2.5rem;
    border: 0.125rem solid black;
    background-color: lightgray;
    border-radius: 0.625rem;

    display: flex;
    align-items: center;
    padding-left: 1rem;
}

.login,
.cart{
    width: 5rem;
    height: 2.5rem;
    border: 0.125rem solid black;

    display: flex;
    justify-content: center;
    align-items: center;
}

.login{
    background-color: lightgreen;
}

.cart{
    background-color: lightpink;
}

/* ================= CATEGORIES ================= */

.box3{
    width: 100%;
    min-height: 5rem;
    border: 0.125rem solid black;
    background-color: white;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    padding: 1rem;
}

.box3 div{
    width: 3rem;
    height: 3rem;
    border: 0.125rem solid black;
    background-color: lightgray;
    border-radius: 0.625rem;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= ADS ================= */

.box4{
    width: 100%;
    border: 0.125rem solid black;
    background-color: white;

    display: flex;
    justify-content: space-evenly;
    flex-wrap: wrap;
    gap: 1rem;
    padding: 1rem;
}

.add1,
.add2,
.add3{
    width: 30%;
    min-width: 250px;
    border: 0.125rem solid black;
}

.add1 img,
.add2 img,
.add3 img{
    width: 100%;
    height: auto;
    display: block;
}

/* ================= BANNER ================= */

.box5{
    width: 100%;
    border: 0.125rem solid black;
    background-color: white;
    padding: 1rem;
}

.banner{
    width: 100%;
    border: 0.125rem solid black;
}

.banner img{
    width: 100%;
    height: auto;
    display: block;
}

</style>
</head>

<body>

<div class="container">

    <div class="box1">
        <div class="flipkart">FC</div>
        <div class="travel">TR</div>
        <div class="location">
            location not set <b>Enter manually</b>
        </div>
    </div>

    <div class="box2">
        <div class="search">
            <ul position="fixed" style="list-style: none; display: flex; gap: 15px; padding-left: 15px;">
                <li><a href="#home">home</a></li>
                <li><a href="#electronics">Electronics</a></li>
                <li><a href="#fashion">Fashion</a></li>
                <li><a href="#home">Home</a></li>
                <li><a href="#appliances">Appliances</a></li>
                <li><a href="#more">More</a></li>
            </ul>
            
            
        </div>
        <div class="login">Login</div>
        <div class="cart">Cart</div>
    </div>

    <div class="box3">
        <div><img src="for_you.svg" alt="for you"></div>
        <div><img src="fashion.svg" alt="fashion"></div>
        <div><img src="mobiles.svg" alt="mobiles"></div>
        <div><img src="beauty.svg" alt="beauty"></div>
        <div><img src="electronics.svg" alt="electronics"></div>
        <div><img src="home-final.svg" alt="home"></div>
        <div><img src="tv.svg" alt="tv"></div>
        <div><img src="toy.svg" alt="toy"></div>
    </div>

    <div class="box4">
        <div class="add1">
            <img src="add1.webp" alt="Add 1">
        </div>

        <div class="add2">
            <img src="add2.webp" alt="Add 2">
        </div>

        <div class="add3">
            <img src="add3.webp" alt="Add 3">
        </div>
    </div>

    <div class="box5">
        <div class="banner">
            <img src="banner.webp" alt="banner">
        </div>
    </div>

</div>

</body>
</html>
