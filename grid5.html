<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>

    <style>
        body{
            background-color: #ffffff;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr ;
            grid-template-rows: 1fr 1fr 1fr ;
            gap: 10px;
            height: 100vh;
        }
        .box1{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
        }
        .box2{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
            align-self: end;
            justify-self: center;
        }
        .box3{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
            justify-self: end;
        }
        .box4{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
            align-self: center;
        }
        .box5{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
            align-self: center;
             justify-self: center;
        }
        .box6{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
            align-self: center;
             justify-self: end;
        }
        .box7{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
            align-self: end;
        
        }
        .box8{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
            justify-self: center;
            
        }
        .box9{
            background-color: #35206d;
            height: 50%;
            width: 50%;
            display: flex;
            justify-self: end;
            align-self: end;
        }

    </style>


</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
        <div class="box7"></div>
        <div class="box8"></div>
        <div class="box9"></div>
    </div>
</body>
</html>
